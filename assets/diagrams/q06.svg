<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title6"><title id="title6">問6 漸化式と増加率の図解</title><defs><marker id="arrow6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><g font-family="Meiryo, Yu Gothic, sans-serif"><rect x="0" y="0" width="800" height="380" rx="0" fill="#fbfdff" stroke="none" stroke-width="2"/><text x="24" y="38" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">問6  漸化式と増加率</text><text x="35" y="91" font-size="26" fill="#16324f" text-anchor="start" font-weight="400">f(n＋1)＝(2−0.2)f(n)＝1.8f(n)</text><text x="40" y="154" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">前世代</text><rect x="175" y="123" width="270" height="54" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="310" y="158" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">100匹</text><text x="40" y="235" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">次世代</text><rect x="175" y="204" width="270" height="54" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><rect x="445" y="204" width="216" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="310" y="239" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">元の100匹</text><text x="553" y="239" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">増えた80匹</text><rect x="20" y="316" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="348" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">180匹＝180％の量。増加率は 80％</text></g></svg>