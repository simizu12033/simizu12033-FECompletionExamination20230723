<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title58"><title id="title58">問58 線形計画法の図解</title><defs><marker id="arrow58" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><g font-family="Meiryo, Yu Gothic, sans-serif"><rect x="0" y="0" width="800" height="520" rx="0" fill="#fbfdff" stroke="none" stroke-width="2"/><text x="24" y="38" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">問58  線形計画法</text><line x1="95" y1="375" x2="440" y2="375" stroke="#16324f" stroke-width="2" marker-end="url(#arrow58)"/><line x1="95" y1="375" x2="95" y2="115" stroke="#16324f" stroke-width="2" marker-end="url(#arrow58)"/><text x="430" y="408" font-size="20" fill="#16324f" text-anchor="end" font-weight="400"></text><text x="90" y="103" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">y（製品B）</text><text x="255" y="436" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">x（製品A）</text><path d="M95 375 L355 375 L355 245 L225 115 L95 115 Z" fill="#dcf3e9" stroke="#087f68" stroke-width="3"/><line x1="225" y1="115" x2="440" y2="330" stroke="#2563a6" stroke-width="2" stroke-dasharray="7 5"/><line x1="268.33" y1="115" x2="441.67" y2="375" stroke="#b33b44" stroke-width="3" stroke-dasharray="7 5"/><circle cx="355" cy="245" r="8" fill="#b33b44" stroke="#b33b44" stroke-width="3"/><text x="367" y="225" font-size="22" fill="#b33b44" text-anchor="start" font-weight="400">(4,2)</text><text x="161" y="310" font-size="20" fill="#087f68" text-anchor="start" font-weight="400">全制約を満たす</text><text x="180" y="341" font-size="20" fill="#087f68" text-anchor="start" font-weight="400">実行可能領域</text><rect x="474" y="90" width="290" height="195" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="619.0" y="150.5" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">説明例</text><text x="619.0" y="180.5" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">x＋y≦6</text><text x="619.0" y="210.5" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">0≦x≦4、0≦y≦4</text><text x="619.0" y="240.5" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">利益 z＝3x＋2y</text><text x="487" y="335" font-size="22" fill="#b33b44" text-anchor="start" font-weight="400">最大は (4,2)：z＝16</text><text x="487" y="379" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">利益の線を高い方へ動かす</text><rect x="20" y="456" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="488" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">一次式の制約の下で、一次式の目的を最適化＝線形計画法</text><text x="95" y="407" font-size="18" fill="#16324f" text-anchor="middle" font-weight="400">0</text><text x="80" y="382" font-size="18" fill="#16324f" text-anchor="end" font-weight="400">0</text><text x="225" y="407" font-size="18" fill="#16324f" text-anchor="middle" font-weight="400">2</text><text x="80" y="252" font-size="18" fill="#16324f" text-anchor="end" font-weight="400">2</text><text x="355" y="407" font-size="18" fill="#16324f" text-anchor="middle" font-weight="400">4</text><text x="80" y="122" font-size="18" fill="#16324f" text-anchor="end" font-weight="400">4</text></g></svg>