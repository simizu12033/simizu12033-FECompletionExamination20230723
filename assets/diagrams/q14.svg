<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title14"><title id="title14">問14 コンパイラの最適化の図解</title><defs><marker id="arrow14" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><g font-family="Meiryo, Yu Gothic, sans-serif"><rect x="0" y="0" width="800" height="440" rx="0" fill="#fbfdff" stroke="none" stroke-width="2"/><text x="24" y="38" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">問14  コンパイラの最適化</text><rect x="25" y="82" width="340" height="150" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="195.0" y="120.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">最適化前</text><text x="195.0" y="150.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">for 各要素：</text><text x="195.0" y="180.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">  t＝a×b を毎回計算</text><text x="195.0" y="210.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">  結果[i]＝t＋i</text><rect x="435" y="82" width="340" height="150" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="605.0" y="120.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">最適化後</text><text x="605.0" y="150.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">t＝a×b を一度計算</text><text x="605.0" y="180.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">for 各要素：</text><text x="605.0" y="210.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">  結果[i]＝t＋i</text><line x1="375" y1="155" x2="425" y2="155" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow14)"/><text x="195" y="285" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">100回繰返し → 乗算100回</text><text x="605" y="285" font-size="21" fill="#087f68" text-anchor="middle" font-weight="400">100回繰返し → 乗算1回</text><text x="400" y="329" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">aとbが変化しない場合の説明例</text><rect x="20" y="376" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="408" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">結果を保ち、無駄な計算を削減 → 実行時間を短縮</text></g></svg>