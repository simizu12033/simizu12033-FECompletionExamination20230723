4f" text-anchor="middle" font-weight="400">担当3  30時間</text><rect x="460" y="286" width="217.5" height="48" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="568.75" y="318.0" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">担当4  30時間</text><line x1="350" y1="206" x2="445" y2="206" stroke="#2563a6" stroke-width="3" marker-end="url(#arrow56)"/><text x="400" y="357" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">総仕事量は120時間のまま、1人の時間を減らす</text><rect x="20" y="401" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="433" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">労働時間を短縮して仕事を分担 → 雇用を維持・創出</text></g></svg>