f" text-anchor="middle" font-weight="400">回転待ち</text><rect x="640" y="307" width="120" height="56" rx="8" fill="#fff0cc" stroke="#2563a6" stroke-width="2"/><text x="700.0" y="343.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">転送</text><rect x="20" y="421" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="453" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">位置決め短縮、または回転速度向上 → アクセス改善</text></g></svg>