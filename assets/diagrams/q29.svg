hor="middle" font-weight="400">内容が変わると検証に失敗 → 改ざんを検知</text><rect x="20" y="411" width="760" height="48" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="443" font-size="22" fill="#087f68" text-anchor="middle" font-weight="700">秘密鍵で署名、公開鍵で検証。内容を隠す暗号化とは別</text></g></svg>